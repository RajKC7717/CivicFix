server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths fall through to index.html so that
    # /admin/equity and /track/NN-XXXX work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the API, so the browser never needs CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
